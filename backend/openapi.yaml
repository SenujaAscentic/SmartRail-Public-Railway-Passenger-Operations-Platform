openapi: '3.1.1'
info:
  title: SmartRail.Api | v1
  version: 1.0.0
paths:
  /api/v1/stations:
    get:
      tags:
        - Network
      operationId: SearchStations
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StationSummary'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/staff/sign-in:
    post:
      tags:
        - Identity
      operationId: StaffSignIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffSignInRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/refresh:
    post:
      tags:
        - Identity
      operationId: RefreshSession
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/sign-out:
    post:
      tags:
        - Identity
      operationId: SignOut
      responses:
        '204':
          description: No Content
  /api/v1/staff/me:
    get:
      tags:
        - Identity
      operationId: GetStaffMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMeResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
components:
  schemas:
    AccessTokenResponse:
      required:
        - accessToken
        - expiresAt
      type: object
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    ProblemDetails:
      required:
        - code
        - requestId
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
        code:
          type: string
        requestId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    StaffMeResponse:
      required:
        - name
        - role
        - stationId
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        stationId:
          type:
            - 'null'
            - string
          format: uuid
    StaffSignInRequest:
      required:
        - staffNumber
        - password
      type: object
      properties:
        staffNumber:
          type:
            - 'null'
            - string
        password:
          type:
            - 'null'
            - string
    StationSummary:
      required:
        - id
        - code
        - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Network
  - name: Identity
