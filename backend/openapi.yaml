openapi: '3.1.1'
info:
  title: SmartRail.Api | v1
  version: 1.0.0
paths:
  /api/v1/stations:
    get:
      tags:
        - Network
      operationId: SearchStations
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StationSummary'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/v1/stations/{stationId}':
    get:
      tags:
        - Network
      operationId: GetStation
      parameters:
        - name: stationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/lines:
    get:
      tags:
        - Network
      operationId: GetLines
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LineResponse'
  /api/v1/stream:
    get:
      tags:
        - LiveOperations
      summary: 'Public event stream (Server-Sent Events). Give at least one of journeyIds, stationIds, lineIds (comma-separated GUIDs); send Last-Event-ID to resume.'
      operationId: StreamEvents
      parameters:
        - name: journeyIds
          in: query
          schema:
            type: string
        - name: stationIds
          in: query
          schema:
            type: string
        - name: lineIds
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/journeys/search:
    get:
      tags:
        - LiveOperations
      summary: Direct journeys between two stations on a date. Past departures are hidden; cancelled journeys are included with their status.
      operationId: SearchJourneys
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JourneySummaryResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/v1/journeys/{journeyId}':
    get:
      tags:
        - LiveOperations
      operationId: GetJourney
      parameters:
        - name: journeyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyDetailResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/staff/sign-in:
    post:
      tags:
        - Identity
      operationId: StaffSignIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignInRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/crew/sign-in:
    post:
      tags:
        - Identity
      operationId: CrewSignIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignInRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/crew/cab-sign-in:
    post:
      tags:
        - Identity
      operationId: CabSignIn
      parameters:
        - name: X-Device-Id
          in: header
          schema:
            type: string
        - name: X-Device-Secret
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CabSignInRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CabSignInResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/refresh:
    post:
      tags:
        - Identity
      operationId: RefreshSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/sign-out:
    post:
      tags:
        - Identity
      operationId: SignOut
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: No Content
  /api/v1/staff/me:
    get:
      tags:
        - Identity
      operationId: GetStaffMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMeResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
components:
  schemas:
    AccessTokenResponse:
      required:
        - accessToken
        - expiresAt
      type: object
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        refreshToken:
          type:
            - 'null'
            - string
        refreshExpiresAt:
          type:
            - 'null'
            - string
          format: date-time
    CabSignInRequest:
      required:
        - staffNumber
        - password
        - deviceTime
      type: object
      properties:
        staffNumber:
          type:
            - 'null'
            - string
        password:
          type:
            - 'null'
            - string
        deviceTime:
          type:
            - 'null'
            - string
          format: date-time
    CabSignInResponse:
      required:
        - accessToken
        - expiresAt
        - refreshToken
        - refreshExpiresAt
        - crewSessionId
        - serverTime
      type: object
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
        crewSessionId:
          type: string
          format: uuid
        serverTime:
          type: string
          format: date-time
    CoachResponse:
      required:
        - position
        - class
        - seating
      type: object
      properties:
        position:
          type: integer
          format: int32
        class:
          type: string
        seating:
          type: string
    JourneyDetailFreshnessResponse:
      required:
        - tracking
        - updatedAt
        - lastPosition
      type: object
      properties:
        tracking:
          type: string
        updatedAt:
          type:
            - 'null'
            - string
          format: date-time
        lastPosition:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PositionResponse'
    JourneyDetailResponse:
      required:
        - journeyId
        - serviceNumber
        - name
        - trainType
        - serviceDate
        - status
        - from
        - to
        - freshness
        - hold
        - reason
        - version
        - stops
        - trainSet
      type: object
      properties:
        journeyId:
          type: string
          format: uuid
        serviceNumber:
          type: string
        name:
          type: string
        trainType:
          type: string
        serviceDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/JourneyStatusResponse'
        from:
          $ref: '#/components/schemas/JourneyFromResponse'
        to:
          $ref: '#/components/schemas/JourneyToResponse'
        freshness:
          $ref: '#/components/schemas/JourneyDetailFreshnessResponse'
        hold:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/JourneyHoldResponse'
        reason:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/JourneyReasonResponse'
        version:
          type: integer
          format: int32
        stops:
          type: array
          items:
            $ref: '#/components/schemas/JourneyStopResponse'
        trainSet:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TrainSetResponse'
    JourneyFreshnessResponse:
      required:
        - tracking
        - updatedAt
      type: object
      properties:
        tracking:
          type: string
        updatedAt:
          type:
            - 'null'
            - string
          format: date-time
    JourneyFromResponse:
      required:
        - stationId
        - name
        - scheduledDeparture
        - expectedDeparture
        - platform
        - previousPlatform
      type: object
      properties:
        stationId:
          type: string
          format: uuid
        name:
          type: string
        scheduledDeparture:
          type:
            - 'null'
            - string
          format: date-time
        expectedDeparture:
          type:
            - 'null'
            - string
          format: date-time
        platform:
          type: string
        previousPlatform:
          type:
            - 'null'
            - string
    JourneyHoldResponse:
      required:
        - stationId
        - minutes
      type: object
      properties:
        stationId:
          type: string
          format: uuid
        minutes:
          type:
            - 'null'
            - integer
          format: int32
    JourneyReasonResponse:
      required:
        - code
        - note
      type: object
      properties:
        code:
          type: string
        note:
          type:
            - 'null'
            - string
    JourneyStatusResponse:
      required:
        - kind
        - delayMinutes
      type: object
      properties:
        kind:
          type: string
        delayMinutes:
          type:
            - 'null'
            - integer
          format: int32
    JourneyStopResponse:
      required:
        - sequence
        - stationId
        - name
        - callType
        - status
        - isAdded
        - scheduledArrival
        - expectedArrival
        - actualArrival
        - scheduledDeparture
        - expectedDeparture
        - actualDeparture
        - plannedPlatform
        - platform
        - previousPlatform
      type: object
      properties:
        sequence:
          type: integer
          format: int32
        stationId:
          type: string
          format: uuid
        name:
          type: string
        callType:
          type: string
        status:
          type: string
        isAdded:
          type: boolean
        scheduledArrival:
          type:
            - 'null'
            - string
          format: date-time
        expectedArrival:
          type:
            - 'null'
            - string
          format: date-time
        actualArrival:
          type:
            - 'null'
            - string
          format: date-time
        scheduledDeparture:
          type:
            - 'null'
            - string
          format: date-time
        expectedDeparture:
          type:
            - 'null'
            - string
          format: date-time
        actualDeparture:
          type:
            - 'null'
            - string
          format: date-time
        plannedPlatform:
          type: string
        platform:
          type: string
        previousPlatform:
          type:
            - 'null'
            - string
    JourneySummaryResponse:
      required:
        - journeyId
        - serviceNumber
        - name
        - trainType
        - serviceDate
        - status
        - from
        - to
        - freshness
        - hold
        - reason
        - version
      type: object
      properties:
        journeyId:
          type: string
          format: uuid
        serviceNumber:
          type: string
        name:
          type: string
        trainType:
          type: string
        serviceDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/JourneyStatusResponse'
        from:
          $ref: '#/components/schemas/JourneyFromResponse'
        to:
          $ref: '#/components/schemas/JourneyToResponse'
        freshness:
          $ref: '#/components/schemas/JourneyFreshnessResponse'
        hold:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/JourneyHoldResponse'
        reason:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/JourneyReasonResponse'
        version:
          type: integer
          format: int32
    JourneyToResponse:
      required:
        - stationId
        - name
        - scheduledArrival
        - expectedArrival
      type: object
      properties:
        stationId:
          type: string
          format: uuid
        name:
          type: string
        scheduledArrival:
          type:
            - 'null'
            - string
          format: date-time
        expectedArrival:
          type:
            - 'null'
            - string
          format: date-time
    LineResponse:
      required:
        - lineId
        - code
        - name
        - routes
      type: object
      properties:
        lineId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteResponse'
    PasswordSignInRequest:
      required:
        - staffNumber
        - password
      type: object
      properties:
        staffNumber:
          type:
            - 'null'
            - string
        password:
          type:
            - 'null'
            - string
    PlatformResponse:
      required:
        - number
        - inService
      type: object
      properties:
        number:
          type: string
        inService:
          type: boolean
    PositionResponse:
      required:
        - latitude
        - longitude
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    ProblemDetails:
      required:
        - code
        - requestId
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          type:
            - 'null'
            - integer
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
        code:
          type: string
        requestId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    RefreshRequest:
      required:
        - refreshToken
      type: object
      properties:
        refreshToken:
          type:
            - 'null'
            - string
    RouteResponse:
      required:
        - routeId
        - code
        - direction
        - name
        - stations
      type: object
      properties:
        routeId:
          type: string
          format: uuid
        code:
          type: string
        direction:
          type: string
        name:
          type: string
        stations:
          type: array
          items:
            $ref: '#/components/schemas/RouteStationResponse'
    RouteStationResponse:
      required:
        - stationId
        - code
        - name
        - distanceKm
        - latitude
        - longitude
      type: object
      properties:
        stationId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        distanceKm:
          type: number
          format: double
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    StaffMeResponse:
      required:
        - name
        - role
        - stationId
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        stationId:
          type:
            - 'null'
            - string
          format: uuid
    StationResponse:
      required:
        - stationId
        - code
        - name
        - latitude
        - longitude
        - cateringStation
        - platforms
      type: object
      properties:
        stationId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        cateringStation:
          type: boolean
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/PlatformResponse'
    StationSummary:
      required:
        - id
        - code
        - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    TrainSetResponse:
      required:
        - code
        - traction
        - coaches
      type: object
      properties:
        code:
          type: string
        traction:
          type: string
        coaches:
          type: array
          items:
            $ref: '#/components/schemas/CoachResponse'
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Network
  - name: LiveOperations
  - name: Identity
