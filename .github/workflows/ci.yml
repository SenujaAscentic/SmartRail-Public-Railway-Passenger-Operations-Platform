name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build backend/SmartRail.sln --configuration Release
      # Integration tests start PostgreSQL themselves (Testcontainers); Docker is preinstalled on ubuntu-latest.
      - name: Test
        run: dotnet test backend/SmartRail.sln --configuration Release --no-build
