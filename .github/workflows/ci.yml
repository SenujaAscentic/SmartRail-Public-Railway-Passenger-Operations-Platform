name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build backend/SmartRail.sln --configuration Release
      # Integration tests start PostgreSQL themselves (Testcontainers); Docker is preinstalled on ubuntu-latest.
      - name: Test
        run: dotnet test --solution backend/SmartRail.sln --configuration Release --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm ci installs exactly what package-lock.json says (every dependency is pinned); install scripts are off (web/.npmrc).
      - name: Install
        run: npm ci
      # Fails when src/schema.d.ts no longer matches backend/openapi.yaml (ADR-09, C-8).
      - name: API types match openapi.yaml
        run: npm run api:check -w @smartrail/api-client
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
